# This workflow is managed by gh actions-lock.
name: Secret Scanner
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
jobs:
  scan:
    permissions:
      contents: read
      pull-requests: write
      actions: read
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@3a8d73b9d7fa129b88c9a3fc0aaac871cb10562f
    secrets: inherit
