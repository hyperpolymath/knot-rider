name: Secret Scanner
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan:
    permissions:
      contents: read
      pull-requests: write
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@99e493aed059015283b95b38ba45cb345dc400a9
    secrets: inherit
