# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
name: Central Estate CI/CD Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  estate-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      
      - name: Required Files Gate
        uses: hyperpolymath/cicd-suite/actions/required-files-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: Code Hygiene Gate
        uses: hyperpolymath/cicd-suite/actions/code-hygiene-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: Manifest Validation Gate
        uses: hyperpolymath/cicd-suite/actions/manifest-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: Idris2 ABI Purity Gate
        uses: hyperpolymath/cicd-suite/actions/idris2-abi-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: Zig Hexadeca API Gate
        uses: hyperpolymath/cicd-suite/actions/zig-hexadeca-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: Contractile Validation Gate
        uses: hyperpolymath/cicd-suite/actions/contractile-validation-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: Recipes Set Validation Gate
        uses: hyperpolymath/cicd-suite/actions/recipes-set-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: Affirmation Document Gate
        uses: hyperpolymath/cicd-suite/actions/affirmation-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: Academic Referencing Gate
        uses: hyperpolymath/cicd-suite/actions/referencing-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: Semantic Audit Gate
        uses: hyperpolymath/cicd-suite/actions/semantic-audit-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: SPDX License Gate
        uses: hyperpolymath/cicd-suite/actions/spdx-license-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: Proof Runner Gate
        uses: hyperpolymath/cicd-suite/actions/proof-runner-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: PRAT Testing Gate
        uses: hyperpolymath/cicd-suite/actions/prat-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: Panic Attack & Pons Gate
        uses: hyperpolymath/cicd-suite/actions/custom-tools-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: WWW & Well-Known Compliance Gate
        uses: hyperpolymath/cicd-suite/actions/www-compliance-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: BoJ Cartridge Validation Gate
        uses: hyperpolymath/cicd-suite/actions/boj-cartridge-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: Formatting Validation Gate
        uses: hyperpolymath/cicd-suite/actions/formatting-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: Accreditations & Badges Gate
        uses: hyperpolymath/cicd-suite/actions/badges-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: Metrics Extraction Gate
        uses: hyperpolymath/cicd-suite/actions/metrics-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: Linguist & Banned Languages Gate
        uses: hyperpolymath/cicd-suite/actions/linguist-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: Test & Benchmarks Dashboard Gate
        uses: hyperpolymath/cicd-suite/actions/tests-benches-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: Hosting & Site Status Gate
        uses: hyperpolymath/cicd-suite/actions/hosting-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: Git-Sea Analytics Gate
        uses: hyperpolymath/cicd-suite/actions/gitsea-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: Trust & Humans Validation Gate
        uses: hyperpolymath/cicd-suite/actions/trust-humans-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: Are We UnAPI Gate (Secret Scanning)
        uses: hyperpolymath/cicd-suite/actions/secrets-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
        
      - name: Reasonably Good Token Validation Gate
        uses: hyperpolymath/cicd-suite/actions/vaulted-tokens-check@fc64172aa53e85289d5d7d6e15c2435a867cc1c9
