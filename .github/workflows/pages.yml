# This workflow is managed by gh actions-lock.
name: GitHub Pages (Ddraig SSG)
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: ghcr.io/stefan-hoeck/idris2-pack@sha256:f0758996a931fb35d9ecb1de273c4d59dabe2a09b433afc7e357f65a08b7e1ff
    steps:
      - name: Checkout Site
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Checkout Ddraig SSG
        uses: actions/checkout@v7.0.1
        with:
          repository: hyperpolymath/ddraig-ssg@f8a462f67dbbd14aab79657e89d8f7618527eace
          path: .ddraig-ssg
          persist-credentials: false
      - name: Compile Ddraig
        working-directory: .ddraig-ssg
        run: idris2 Ddraig.idr -o ddraig
      - name: Build site
        run: |
          mkdir -p src
          if [ ! -f src/index.md ] && [ -f README.md ]; then
            cp README.md src/index.md
          elif [ ! -f src/index.md ]; then
            # Use source commit timestamp for deterministic builds
            echo "# ${GITHUB_REPOSITORY}" > src/index.md
            echo "" >> src/index.md
            echo "Built from commit: ${GITHUB_SHA::8}" >> src/index.md
            echo "Built at: $(git log -1 --format=%cd --date=iso-strict)" >> src/index.md
          fi
          ./.ddraig-ssg/build/exec/ddraig build src _site https://hyperpolymath.github.io/${GITHUB_REPOSITORY#*/}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: '_site'
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
